platform:
  config:
    existingEnvSecret: ret2shell-platform-env

postgresql:
  mode: external
  external:
    host: postgresql.example.com
    port: 5432
    sslMode: require
    existingSecret: ret2shell-external-postgresql
    secretKeys:
      username: database-user
      password: database-password
      database: database-name

valkey:
  mode: external
  external:
    existingSecret: ret2shell-external-valkey
    secretKeys:
      url: valkey-url

nats:
  mode: external
  external:
    host: nats.example.com
    port: 4222
    tls: true
    existingSecret: ret2shell-external-nats
    secretKeys:
      token: nats-token
      user: ""
      password: ""

registry:
  mode: external
  external:
    existingSecret: ret2shell-registry-credentials
    secretKeys:
      username: registry-user
      password: registry-password

victoriaLogs:
  mode: external
  external:
    existingSecret: ret2shell-external-victoria-logs
    secretKeys:
      url: victoria-logs-url
